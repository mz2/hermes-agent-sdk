summary: Launch workshop and validate hermes + gateway service wiring

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  echo "[1/4] hermes runs inside the workshop"
  workshop exec -- hermes --version | MATCH '^Hermes Agent v'

  echo "[2/4] gateway unit is installed and enabled"
  workshop exec -- hermes gateway status | MATCH 'Loaded: loaded|enabled; preset: enabled|✓ Systemd linger is enabled'

  echo "[3/4] gateway can be started"
  workshop exec -- hermes gateway start
  workshop exec -- hermes gateway status | MATCH 'Active: active \(running\)|✓ User gateway service is running'

  echo "[4/4] a plugin declaring Python deps installs (hermes reads its own pyproject.toml)"
  # The probe-plugin fixture is mounted at /project/probe-plugin; git-init it in
  # place so the file:// installer can clone it. Without the shipped
  # pyproject.toml, dependency admission aborts with FileNotFoundError.
  workshop exec -- bash -lc '
    set -euo pipefail
    cd /project/probe-plugin
    git init -q
    git -c user.email=sdk@test -c user.name=sdk add -A
    git -c user.email=sdk@test -c user.name=sdk commit -qm probe
    hermes plugins install "file://$PWD" --enable --yes-deps
  '
  workshop exec -- hermes plugins list --enabled --plain | MATCH 'sdk-pyproject-probe'

  echo "ALL PASS"

debug: |
  workshop tasks
  workshop exec -- hermes --version || true
  workshop exec -- hermes gateway status || true
  workshop exec -- systemctl --user status hermes-gateway.service --no-pager --lines=40 || true
  workshop exec -- hermes plugins list --plain || true
